name: Deploy

# Runs only after CI succeeds on master, so nothing reaches production until
# lint, typecheck and all 153 tests have passed.
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Migrations run before the new code goes live: the runtime image has no
      # Prisma CLI, and Render's free tier has no pre-deploy command.
      - name: Apply migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "Render deploy hook responded $status"
          test "$status" -ge 200 && test "$status" -lt 300
