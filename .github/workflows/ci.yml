name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ledgercore
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ledgercore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgercore -d ledgercore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ledgercore:ci-password@localhost:5432/ledgercore_test?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-real-00000
      JWT_EXPIRES_IN_SECONDS: 900
      WEBHOOK_SECRET: ci-only-webhook-secret-not-used-for-real-00
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration and concurrency tests
        run: npm run test:e2e
